services:
  tnoodle:
    image: ghcr.io/tdshaw2000/scramble-challenge/tnoodle:1.2.3
    build:
      context: docker/tnoodle
      args:
        TNOODLE_VERSION: "1.2.3"
    restart: unless-stopped
    # No published port: only the web container talks to TNoodle.

  web:
    image: ghcr.io/tdshaw2000/scramble-challenge/web:latest
    build: .
    restart: unless-stopped
    ports:
      # Localhost only: the public way in is through Caddy.
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    environment:
      DATABASE_URL: sqlite:////data/scramble.db
      TNOODLE_URL: http://tnoodle:2014
      TRUSTED_PROXIES: "1"
    # The admin password hash and secret key, written by scripts/set_admin_password.py.
    # Kept outside the repo checkout; without it the admin area is switched off.
    env_file:
      - path: /etc/scramble-challenge/admin.env
        required: false
    volumes:
      - data:/data
    depends_on:
      - tnoodle
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    # The web image, running app/backup.py: a snapshot of the database every night at
    # 03:00 UK time, kept on its own volume. The deploy also uses it for a snapshot
    # before every restart. README.md says how to restore one.
    image: ghcr.io/tdshaw2000/scramble-challenge/web:latest
    command: ["python", "-m", "app.backup", "schedule"]
    init: true  # passes on the stop signal, so a restart does not wait 10s
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/scramble.db
      BACKUP_DIR: /backups
    volumes:
      - data:/data
      - backups:/backups

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Same trick: a bare port in CI/local dev, the real domain only at deploy time,
      # so nothing here ever attempts a live ACME challenge for a domain it doesn't own.
      WCA_SITE_ADDRESS: ${WCA_SITE_ADDRESS:-:8080}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # HTTPS certificates; keep them to avoid Let's Encrypt rate limits
    depends_on:
      - web
    networks:
      - default
      # Shared with other apps' own compose projects on the same server, so Caddy can
      # reach their containers by name. Created once by scripts/server-setup.sh (and by
      # CI, for the smoke test); see README.md.
      - edge

volumes:
  data:
  backups:
  caddy_data:

networks:
  edge:
    name: scramble-challenge-edge
    external: true
