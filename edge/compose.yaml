# The standalone Caddy stack that fronts scramble-challenge and any other app sharing
# its "scramble-challenge-edge" Docker network (wca-records-analyser today). Its own
# Compose project, named "caddy", so redeploying scramble-challenge's own stack never
# restarts this, and vice versa. See README.md for setup and how to deploy a change.
name: caddy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SCRCH_SITE_ADDRESS: ${SCRCH_SITE_ADDRESS:-:80}
      # Same trick: a bare port in CI/local dev, the real domain only at deploy time,
      # so nothing here ever attempts a live ACME challenge for a domain it doesn't own.
      WCA_SITE_ADDRESS: ${WCA_SITE_ADDRESS:-:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # HTTPS certificates; keep them to avoid Let's Encrypt rate limits
    networks:
      - edge

volumes:
  caddy_data:

networks:
  edge:
    name: scramble-challenge-edge
    external: true
