<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scramble Challenge{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='themes/' ~ skin ~ '/theme.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ url_for('main.landing') }}" aria-label="Scramble Challenge">
      {%- for word in ["Scramble", "Challenge"] -%}
      <span class="site-title-word">
        {%- for letter in word %}<span class="site-title-letter">{{ letter }}</span>{% endfor -%}
      </span>
      {%- endfor -%}
    </a>
    <details class="skin-picker">
      <summary class="skin-picker-toggle" aria-label="Change skin">&#9881;</summary>
      <form class="skin-menu" method="post" action="{{ url_for('main.choose_skin') }}">
        <p class="skin-menu-title">Skin</p>
        <input type="hidden" name="next" value="{{ skin_next }}">
        {%- for value, label in skins.items() %}
        <button type="submit" class="skin-option" name="skin" value="{{ value }}"{% if value == skin %} aria-current="true"{% endif %}
                data-theme-css="{{ url_for('static', filename='themes/' ~ value ~ '/theme.css') }}">{{ label }}</button>
        {%- endfor %}
      </form>
    </details>
  </header>
  <main class="page">
    {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='skin.js') }}"></script>
</body>
</html>
