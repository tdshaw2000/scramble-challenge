{% extends "base.html" %}
{% block content %}
<form class="card name-form" method="post" action="{{ url_for('main.create_challenge') }}">
  <h2 class="card-title">Start a challenge</h2>
  <label class="field">
    <span class="field-label">Your name</span>
    <input class="field-input" name="display_name" maxlength="50" required autofocus
      {%- if remembered_name %} value="{{ remembered_name }}"{% endif %}>
  </label>
  <button class="button button-primary" type="submit">Start new challenge</button>
</form>
{% endblock %}
