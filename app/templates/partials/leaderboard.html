{# One round's results as a list, used by the summary and admin pages. Needs `results`. #}
<ol class="leaderboard">
  {% for r in results %}
  <li class="result result-{{ r.result }} result-position-{{ r.position }}">
    <span class="position">{{ r.position | ordinal }}</span>
    <span class="name">{{ r.display_name }} ({{ r.points }})</span>
    <span class="time">{{ r.time_ms | solve_time }}</span>
  </li>
  {% endfor %}
</ol>
