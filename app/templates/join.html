{% extends "base.html" %}
{% block content %}
<form class="card name-form" method="post" action="{{ url_for('main.join', slug=challenge.slug) }}">
  <h2 class="card-title">Join the challenge</h2>
  <label class="field">
    <span class="field-label">Your name</span>
    <input class="field-input" name="display_name" maxlength="50" required autofocus>
  </label>
  <button class="button button-primary" type="submit">Join</button>
</form>
{% endblock %}
