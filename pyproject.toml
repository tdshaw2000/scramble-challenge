[project]
name = "scramble-challenge"
version = "0.1.0"
description = "Live multiplayer scramble-timing party game for speedcubers"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-socketio>=5.6.1",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "requests>=2.34.2",
    "simple-websocket>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "pyyaml>=6.0.3",
    "responses>=0.26.3",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not tnoodle' --cov=app --cov-report=term-missing"
markers = [
    "tnoodle: needs a real TNoodle server (deselected unless run with -m tnoodle)",
]

[tool.coverage.run]
# Production entry point only; the smoke test exercises it.
omit = ["app/wsgi.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
